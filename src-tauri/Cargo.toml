[package]
name = "delegate-control"
version = "0.1.0"
description = "Native control console for ChatGPT Delegate"
authors = ["Delegate Control for ChatGPT"]
edition = "2021"

[lib]
name = "delegate_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
